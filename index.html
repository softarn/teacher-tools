<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lärarverktyg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 2rem; font-weight: 800; margin: 0 0 24px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.tool {
      display: block;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.tool:hover { border-color: var(--accent); transform: translateY(-2px); }
    a.tool strong { display: block; font-size: 1.25rem; font-weight: 800; }
    a.tool span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Lärarverktyg</h1>
    <ul>
      <li>
        <a class="tool" href="ordplopp/">
          <strong>Ordplopp</strong>
          <span>Ord blinkar fram en kort stund – träna snabb ordavkodning.</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
