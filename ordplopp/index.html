<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordplopp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="setup">

  <!-- Setup -->
  <main class="setup">
    <section class="card" aria-labelledby="title">
      <header class="card-header">
        <a class="logo" href="../" id="title">
          <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="15" cy="20" r="13" fill="var(--accent)"/>
            <circle cx="29" cy="7" r="5" fill="var(--accent)" opacity="0.45"/>
            <text x="15" y="25.5" text-anchor="middle" font-family="Andika, sans-serif" font-weight="700" font-size="15" fill="var(--accent-text)">ab</text>
          </svg>
          <span>Ordplopp</span>
        </a>
        <p class="tagline">Ord dyker upp en kort stund. Hinner du läsa dem?</p>
      </header>

      <div class="field">
        <div class="field-head">
          <h2>Ordlängd</h2>
          <span id="wordCount" class="badge"></span>
        </div>
        <div id="lengths" class="length-grid" role="group" aria-label="Ordlängd i bokstäver"></div>
      </div>

      <div class="field">
        <div class="field-head">
          <h2>Tempo</h2>
        </div>
        <div id="presets" class="segmented" role="group" aria-label="Tempo"></div>
        <div class="sliders">
          <label class="slider">
            <span>Ordet visas</span>
            <input id="visibleSlider" type="range" min="0.1" max="3" step="0.05">
            <output id="visibleValue" for="visibleSlider"></output>
          </label>
          <label class="slider">
            <span>Paus mellan ord</span>
            <input id="betweenSlider" type="range" min="0.25" max="5" step="0.25">
            <output id="betweenValue" for="betweenSlider"></output>
          </label>
        </div>
      </div>

      <div class="field">
        <div class="field-head">
          <h2>Bokstäver</h2>
        </div>
        <div class="segmented" role="group" aria-label="Bokstäver">
          <button type="button" class="segment case" data-uppercase="false">abc <small>gemener</small></button>
          <button type="button" class="segment case" data-uppercase="true">ABC <small>versaler</small></button>
        </div>
      </div>

      <button id="startButton" type="button" class="start">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8z" fill="currentColor"/></svg>
        Starta
      </button>

      <p class="shortcuts">
        <kbd>Mellanslag</kbd> starta/pausa · <kbd>F</kbd> helskärm · <kbd>R</kbd> visa igen · <kbd>Esc</kbd> inställningar
      </p>
    </section>
  </main>

  <!-- Stage -->
  <main class="stage" id="stage">
    <div id="word" class="word"></div>
    <div id="status" class="status"></div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <nav class="dock" id="dock" aria-label="Kontroller">
      <button id="settingsButton" type="button" class="dock-button" aria-label="Inställningar" title="Inställningar (Esc)">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>

      <button id="repeatButton" type="button" class="dock-button" aria-label="Visa senaste ordet igen" title="Visa igen (R)">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>
      </button>

      <button id="playButton" type="button" class="dock-play" aria-label="Pausa" title="Starta/pausa (Mellanslag)">
        <svg class="icon-pause" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/></svg>
        <svg class="icon-play" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8z" fill="currentColor"/></svg>
      </button>

      <div class="dock-tempo" role="group" aria-label="Tid ordet visas">
        <button id="slowerButton" type="button" class="dock-button small" aria-label="Visa ordet längre" title="Långsammare (−)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <span id="dockTempo" class="dock-tempo-value"></span>
        <button id="fasterButton" type="button" class="dock-button small" aria-label="Visa ordet kortare" title="Snabbare (+)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
        </button>
      </div>

      <button id="fullscreenButton" type="button" class="dock-button" aria-label="Helskärm" title="Helskärm (F)">
        <svg class="icon-expand" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="icon-shrink" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </nav>
  </main>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
